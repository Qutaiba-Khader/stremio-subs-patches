name: Release

# A tag "vX.Y.Z" builds the patch bundle and publishes it as a GitHub release (patches-X.Y.Z.mpp), which Morphe
# builders and Morphe Manager can use as a patch source. Any other push only checks that it builds.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^version = //p' gradle.properties)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "gradle.properties says $v, tag is ${GITHUB_REF_NAME}"; exit 1; }

      - name: Build the bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon :patches:build

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${GITHUB_REF_NAME#v}
          gh release create "${GITHUB_REF_NAME}" "patches/build/libs/patches-$v.mpp" \
            --title "${GITHUB_REF_NAME}" --notes-file CHANGELOG.md --verify-tag
